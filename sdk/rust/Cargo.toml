[package]
name = "agentfs-sdk"
version = "0.6.5"
edition = "2021"
description = "AgentFS SDK for Rust"
license = "MIT"

[dependencies]
# turso 0.8.0 (resolves turso_core/turso_sdk_kit 0.8.x). `default-features`
# is OFF on purpose: 0.8's default `fts` feature fails to compile on current
# nightly rustc (allocator type mismatch in turso_sdk_kit's fts/directory.rs)
# and agentfs uses none of it. `mimalloc` (a 0.8 default) is kept explicitly
# so the allocator stays what 0.7 default builds used; `sync` is the Turso
# Cloud HTTP sync surface AgentFS::pull/push are built on.
turso = { version = "0.8.0", default-features = false, features = ["sync", "mimalloc"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
thiserror = "1.0"
lru = "0.12"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# `aegis`'s C/NEON backend fails to compile with Apple clang on arm64 due to
# missing SHA3/NEON intrinsics (e.g. `veor3q_u8`). Enabling `pure-rust` makes
# `aegis` skip its C build script entirely on macOS.
aegis = { version = "0.9.6", features = ["pure-rust"] }

[dev-dependencies]
tempfile = "3"
proptest = "1.4"
rand = "0.8"

